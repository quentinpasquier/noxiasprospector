[project]
name = "noxiasprospect-backend"
version = "0.1.0"
description = "NoxiasProspect backend — FastAPI service for B2B prospecting"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Noxias", email = "tech@noxias.fr" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.13.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "python-jose[cryptography]>=3.3.0",
    "phonenumbers>=8.13.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "factory-boy>=3.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "pre-commit>=4.0.0",
    "types-python-jose>=3.3.4.20240106",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----- Ruff -----
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle, pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "ASYNC",            # async best-practices
    "S",                # bandit (security)
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff specifics
]
ignore = [
    "E501",  # line-length handled by formatter
    "S101",  # asserts allowed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"app/db/migrations/**" = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----- Mypy -----
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["factory.*", "factory_boy.*"]
ignore_missing_imports = true

# ----- Pytest -----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
]
markers = [
    "integration: integration tests (mocked external APIs)",
    "slow: slow-running tests",
]

# ----- Coverage -----
[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

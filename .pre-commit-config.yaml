# Pre-commit hooks for NoxiasProspect.
# Install once: pre-commit install
# Run on all files: pre-commit run --all-files

repos:
  # ----- Generic hygiene -----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ----- Python: ruff (lint + format) -----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ----- Python: mypy (strict) -----
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/app/
        args: ["--config-file=backend/pyproject.toml"]
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.6.0
          - sqlalchemy>=2.0.36
          - types-python-jose>=3.3.4.20240106

  # ----- Frontend: lint + typecheck via local hooks -----
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint (eslint)
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck (tsc)
        entry: bash -c 'cd frontend && pnpm typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
